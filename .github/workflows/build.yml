name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

  # A push does not always produce a run — one has been missed. Without a manual
  # trigger the only way to retry is to move a tag, which rewrites history for
  # something that was never the tag's fault.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build and, for a v-tag, release"
        required: false
        default: main

jobs:
  build:
    runs-on: ubuntu-latest

    # Creating a release needs write access to repository contents. The default
    # token is read-only, so the build succeeds and only the release step fails.
    permissions:
      contents: write

    steps:
      # KamiToolKit and KamiToolKit.Components are submodules and the project
      # references them directly, so a checkout without them cannot build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The notes become the release body and the Discord post (last step), both
      # made once on publish. A tag without notes stops here, before the build,
      # rather than publishing an empty release.
      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty. Commit it with the version bump, before the tag."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -o latest.zip https://goatcorp.github.io/dalamud-distrib/stg/latest.zip
          mkdir -p ~/.xlcore/dalamud/Hooks/dev/
          unzip -q latest.zip -d ~/.xlcore/dalamud/Hooks/dev/

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # DalamudPackager writes the installable zip and its manifest here. Keeping
      # them as artifacts means any build can be inspected, not only tagged ones.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: TimeMemoria
          path: |
            bin/Release/TimeMemoriaV3/latest.zip
            bin/Release/TimeMemoriaV3/TimeMemoriaV3.json

      # A tagged push becomes a release, which is what a plugin repository's
      # download link points at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            bin/Release/TimeMemoriaV3/latest.zip
            bin/Release/TimeMemoriaV3/TimeMemoriaV3.json

      # Discord's /github webhook shows a release as a title only, so the notes
      # go to the plain webhook as a second post. The release exists by now, so
      # a missing secret warns instead of failing the run.
      - name: Post release notes to Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set, so the notes were not posted to Discord."
            exit 0
          fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          # Headings become bold lines, which every Discord client renders in an embed.
          sed -E 's/^#{1,6} +(.*)$/**\1**/' "release-notes/${GITHUB_REF_NAME}.md" \
            | jq -Rs --arg title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" --arg url "$url" '
                (if length > 4000 then .[:3900] + "\n\n… Full notes on GitHub." else . end) as $d
                | {embeds: [{title: $title, url: $url, description: $d, color: 5763719}]}' \
            | curl -sSf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
